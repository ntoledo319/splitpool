<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#0d1117; }
  #term { padding:26px 30px 90px; font:15px/1.62 'DejaVu Sans Mono',monospace; color:#c9d1d9; white-space:pre-wrap; }
  .cmd { color:#7ee787; font-weight:bold; }
  .tx  { color:#79c0ff; }
  .hdr { color:#d2a8ff; font-weight:bold; }
  .num { color:#ffa657; }
  #capbar { position:fixed; left:0; right:0; bottom:0; height:64px; background:rgba(14,15,19,.94);
    border-top:2px solid #836EF9; display:flex; align-items:center; justify-content:center;
    font:600 21px/1.3 'DejaVu Sans',sans-serif; color:#e8eaf0; text-align:center; padding:0 30px; }
</style></head><body>
<div id="term"></div><div id="capbar"></div>
<script>
// REAL output of scripts/demo_settle_pool4.mjs (pool #4 write-path), captured
// in evidence/pool4-settle-console.log; txs verifiable on testnet.monadvision.com.
const LINES = [
 ["cmd", "$ node scripts/demo_settle_pool4.mjs   # pool #4 write-path, Monad testnet", 2.4],
 ["hdr", "== pool #4 state BEFORE settlement ==", 1.0],
 ["num", "  alice +0.0225 · bob -0.0225 · carol -0.0125 · dana +0.0125 MON", 2.2],
 ["hdr", "== debtors settle ==", 0.9],
 ["", "  bob settles 0.0225 MON", 1.2],
 ["tx", "  tx settle-bob: 0x8e03917df77f6c1257f365c5fb81e3896b0939df71bda074a7d09acb5dbd651b", 1.8],
 ["", "  carol settles 0.0125 MON", 1.2],
 ["tx", "  tx settle-carol: 0xac94d68e2f09c2df64002491b0dc0c8f7b9ac97b27b48926b94ce8c98e9b7942", 1.8],
 ["hdr", "== creditors withdraw ==", 0.9],
 ["tx", "  tx withdraw-alice: 0x996ccd547fb36a4ddbeada08fa390d7c59ee3e700843ddd2602cab879aa98d2f", 1.8],
 ["tx", "  tx withdraw-dana: 0x6a021aad9109da0f594429b5358471e565e06331bf80786070957b14f6eb3fc9", 1.8],
 ["hdr", "== pool #4 state AFTER settlement ==", 1.0],
 ["num", "  alice 0 · bob 0 · carol 0 · dana 0 — everyone square, on-chain", 2.6],
];
const PACE = 1.25;
window.__DUR = LINES.reduce((a, l) => a + l[2], 0) * PACE + 2.0;
const term = document.getElementById("term");
const cap = document.getElementById("capbar");
cap.textContent = "Write-path on camera: real settle() + withdrawCredits() txs, hashes in evidence.md";
let t = 0.6;
LINES.forEach(([cls, text, wait], i) => {
  setTimeout(() => {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = text;
    term.appendChild(div);
    while (term.scrollHeight > 640 && term.firstChild) term.removeChild(term.firstChild);
    if (i === 3) cap.textContent = "Each member signs with their own key - the same calls the dApp buttons make";
    if (i === 11) cap.textContent = "Balances resolved on-chain - no intermediary touched the money";
  }, t * 1000);
  t += wait * PACE;
});
</script></body></html>
